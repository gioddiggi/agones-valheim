# Environment for the Valheim container in gameserver.yaml, with the example
# values from valheim.env.example. Change at least SERVER_NAME, WORLD_NAME and
# SERVER_PASS before using it for a real server.
#
# To build it from your own valheim.env instead:
#
#   kubectl create secret generic valheim-env --from-env-file=valheim.env
apiVersion: v1
kind: Secret
metadata:
  name: valheim-env
type: Opaque
stringData:
  SERVER_NAME: "My Server"
  SERVER_PORT: "2456"
  WORLD_NAME: "Dedicated"
  # Minimum 5 characters
  SERVER_PASS: "secret"
  SERVER_PUBLIC: "true"
  UPDATE_CRON: "*/15 * * * *"
  UPDATE_IF_IDLE: "true"
  RESTART_CRON: "0 5 * * *"
  RESTART_IF_IDLE: "true"
  TZ: "Etc/UTC"
  BACKUPS: "true"
  BACKUPS_CRON: "0 * * * *"
  BACKUPS_DIRECTORY: "/config/backups"
  BACKUPS_MAX_AGE: "3"
  BACKUPS_MAX_COUNT: "0"
  BACKUPS_IF_IDLE: "true"
  BACKUPS_IDLE_GRACE_PERIOD: "3600"
  PERMISSIONS_UMASK: "022"
  STEAMCMD_ARGS: "validate"
  VALHEIM_PLUS: "false"
  BEPINEX: "false"
  SUPERVISOR_HTTP: "false"
  SUPERVISOR_HTTP_PORT: "9001"
  SUPERVISOR_HTTP_USER: "admin"
  STATUS_HTTP: "true"
  STATUS_HTTP_PORT: "80"
  STATUS_HTTP_CONF: "/config/httpd.conf"
  STATUS_HTTP_HTDOCS: "/opt/valheim/htdocs"
  SYSLOG_REMOTE_PORT: "514"
  SYSLOG_REMOTE_AND_LOCAL: "true"
  PUID: "0"
  PGID: "0"
