name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy example/gameserver.yaml
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image version
      placeholder: e.g. v1.2.3
    validations:
      required: true
  - type: input
    id: agones
    attributes:
      label: Agones version
      placeholder: e.g. 1.61.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs from the monitor and Valheim server containers.
      render: shell
